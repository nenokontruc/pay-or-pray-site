# Builds the React site and publishes it to GitHub Pages.
# Runs only when `main` changes (or when started by hand from the Actions tab).
# Requires: repo Settings → Pages → Source = "GitHub Actions".
# Tests run first; if any fail, nothing is published and the live site stays as it was.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3 # same as .mise.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # same as .mise.toml
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # typecheck + tests + production build (dist/)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
